<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Universe — [COMPANY_NAME]</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
  
  :root {
    --primary: #1a56db; --bg: #f8fafc; --card: #ffffff; --text: #1e293b;
    --muted: #64748b; --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 14px; }

  .toolbar {
    position: sticky; top: 0; z-index: 100; background: var(--card);
    border-bottom: 1px solid var(--border); padding: 10px 20px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .toolbar .title { font-weight: 600; font-size: 15px; margin-right: auto; }
  .toolbar button {
    padding: 7px 16px; border: none; border-radius: 6px;
    font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn-save { background: var(--primary); color: #fff; }
  .btn-save:hover { background: #1e40af; }
  .btn-print { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn-print:hover { background: #eff6ff; }
  .btn-select-all { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn-select-none { background: #fff; color: var(--muted); border: 1px solid var(--border); }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; }

  .header {
    background: linear-gradient(135deg, #1e3a5f 0%, #1a56db 100%);
    color: #fff; padding: 28px 24px; border-radius: 10px; margin-bottom: 20px;
  }
  .header h1 { font-size: 24px; font-weight: 700; }
  .header .subtitle { font-size: 14px; opacity: .85; margin-top: 4px; }

  /* Process section */
  .process-section { margin-bottom: 24px; }
  .process-header {
    background: #f1f5f9; padding: 10px 16px; border-radius: 8px 8px 0 0;
    font-weight: 600; font-size: 15px; color: var(--primary);
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-bottom: none;
  }
  .process-header .process-badge {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    background: var(--primary); color: #fff; font-size: 12px;
  }

  table { width: 100%; border-collapse: collapse; }
  th {
    background: #f8fafc; font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted); padding: 8px 12px;
    border: 1px solid var(--border); text-align: left;
  }
  td {
    padding: 8px 12px; border: 1px solid var(--border); vertical-align: middle;
  }
  tr:hover td { background: #f8fafc; }

  .sector-tag {
    display: inline-block; padding: 1px 8px; border-radius: 8px;
    font-size: 11px; font-weight: 500;
    background: #eff6ff; color: var(--primary);
  }
  .sector-tag.unvs { background: #f0fdf4; color: #166534; }

  .scope-select { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }
  .priority-select {
    font-family: 'Sarabun', sans-serif; font-size: 12px; padding: 4px 8px;
    border-radius: 4px; border: 1px solid var(--border);
  }
  td.contenteditable { 
    border-bottom: 1px dashed #cbd5e1; outline: none; min-width: 120px;
    white-space: pre-wrap; word-break: break-word;
  }
  td.contenteditable:focus { background: #f8faff; border-bottom-color: var(--primary); }

  /* Summary */
  .summary-footer {
    margin-top: 20px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px 20px;
    display: flex; gap: 24px; align-items: center;
  }
  .summary-footer .count { font-size: 22px; font-weight: 700; color: var(--primary); }

  .appendix {
    margin-top: 32px; border-top: 2px solid var(--border); padding-top: 20px;
  }
  .appendix h2 { font-size: 18px; color: var(--muted); margin-bottom: 12px; }
  .appendix pre {
    background: #f1f5f9; border-radius: 8px; padding: 14px;
    font-size: 12px; line-height: 1.5; overflow-x: auto;
    white-space: pre-wrap; word-break: break-word; max-height: 350px; overflow-y: auto;
  }

  @media print {
    .toolbar { display: none !important; }
    body { background: #fff; }
    .container { max-width: 100%; padding: 0; }
    .header { background: #1e3a5f !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    input[type="checkbox"], select { -webkit-appearance: auto; }
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <span class="title">🌐 Audit Universe — [COMPANY_NAME]</span>
  <button class="btn-select-all" onclick="selectAll()">✅ เลือกทั้งหมด</button>
  <button class="btn-select-none" onclick="selectNone()">⬜ ยกเลิกทั้งหมด</button>
  <button class="btn-print" onclick="window.print()">🖨️ Print / PDF</button>
  <button class="btn-save" onclick="saveHTML()">💾 Save as HTML</button>
</div>

<div class="container">

<div class="header">
  <h1>Audit Universe</h1>
  <div class="subtitle" contenteditable="true" style="color:#bfdbfe;border-bottom:1px dashed #60a5fa;padding:2px 4px;">
    [COMPANY_NAME] — [INDUSTRY]
  </div>
</div>

<!-- ══ PROCESS SECTIONS — one per process ══ -->
<div id="processSections">
  <!-- Generated dynamically -->
</div>

<!-- Summary footer -->
<div class="summary-footer">
  <div><span class="count" id="selectedCount">0</span> / <span id="totalActivities">0</span> กิจกรรมที่เลือกเข้า Audit Scope</div>
  <div style="margin-left:auto;font-size:13px;color:var(--muted);">
    💡 ใช้ checkbox เพื่อเลือกกิจกรรมที่ต้องการตรวจสอบ
  </div>
</div>

<!-- Appendix -->
<div class="appendix">
  <h2>📎 ภาคผนวก — ข้อมูลดิบ</h2>
  <details>
    <summary style="cursor:pointer;font-weight:600;">📄 Raw MCP Output (process overviews)</summary>
    <pre id="appendixRaw">[MCP_RAW_DATA]</pre>
  </details>
</div>

</div>

<script>
// ── Save ──
function saveHTML() {
  const html = document.documentElement.outerHTML;
  const blob = new Blob(['<!DOCTYPE html>\n' + html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = document.title.replace(/[^a-z0-9ก-๙]/gi, '_') + '.html';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Select all / none ──
function selectAll() {
  document.querySelectorAll('.scope-check').forEach(cb => { cb.checked = true; });
  updateCount();
}
function selectNone() {
  document.querySelectorAll('.scope-check').forEach(cb => { cb.checked = false; });
  updateCount();
}

// ── Update count ──
function updateCount() {
  const checked = document.querySelectorAll('.scope-check:checked').length;
  const total = document.querySelectorAll('.scope-check').length;
  document.getElementById('selectedCount').textContent = checked;
  document.getElementById('totalActivities').textContent = total;
}

// ── Init ──
document.addEventListener('DOMContentLoaded', updateCount);
</script>

</body>
</html>
